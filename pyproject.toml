[project]
name = "golddiggers"
version = "0.1.0"
description = "MAPC Gold Miners (2006/2007) scenario server with a JSON API and a web frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# client-side agent harness (agents/harness.py): report plots
agents = ["matplotlib", "pillow"]

[project.scripts]
golddiggers = "golddiggers.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golddiggers = ["static/*", "static/assets/*"]
